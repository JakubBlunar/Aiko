[project]
name = "english-speaking-assistant"
version = "0.2.0"
description = "Aiko: a web-based AI companion with Ollama chat, RealtimeSTT, Pocket-TTS, Live2D avatar, and LanceDB-backed RAG."
readme = "README.md"
# Upper bound is load-bearing, not cosmetic: ``ctranslate2`` (via
# faster-whisper) publishes no sdist and no cp314 wheels, so a 3.14
# install resolves "fine" and then dies at runtime with
# ``ModuleNotFoundError: No module named 'faster_whisper'``. Capping here
# turns that into an upfront, readable pip error.
requires-python = ">=3.11,<3.14"
# Every entry carries an upper bound so a fresh install can't silently pick up
# a breaking major. The floors stay where they are (they're the real minimums
# we support); ``requirements.lock`` holds the exact, known-good resolution.
dependencies = [
  # HTTP + audio processing
  "requests>=2.32.3,<3",
  "numpy>=2.2.3,<3",
  "scipy>=1.13.0,<2",
  "soundfile>=0.13.0,<0.14",
  "audioop-lts>=0.2.1,<0.3; python_version>='3.13'",
  # Web/MCP servers. FastAPI backs the whole HTTP/WebSocket layer
  # (app/web/server.py + all REST modules); pin it explicitly rather
  # than relying on it arriving transitively through ``mcp`` so a clean
  # install (e.g. a slim Docker image) can't boot without it.
  "fastapi>=0.110.0,<1",
  "uvicorn>=0.30.0,<1",
  # uvicorn's WebSocket support is an optional extra: without a protocol
  # implementation installed it answers the /ws handshake with a bare 404
  # and the whole UI (which is WS-driven) silently never connects. It
  # arrives transitively in a dev checkout, so the failure only shows up
  # in a clean install such as the slim Docker image. Depend on it
  # explicitly instead of taking uvicorn[standard] (which also drags in
  # uvloop / httptools / watchfiles we don't use).
  "websockets>=12.0,<17",
  "mcp>=1.0.0,<2",
  # RAG: LanceDB-backed vector store for memories, messages, and documents.
  # Still pre-1.0 and routinely breaks across minors, so the ceiling is tight.
  "lancedb>=0.30.2,<0.32",
  "pyarrow>=16.0.0,<25",
  # K9 topic graph: Louvain community detection over the mutual-k-NN graph.
  "networkx>=3.0,<4",
  # Optional document ingestion (PDF). Pure-python; tiny footprint.
  "pypdf>=4.0.0,<7",
  # Web search tool (the package formerly published as duckduckgo-search)
  "ddgs>=9.0.0,<10",
  # Secure API-key storage in the OS keychain (Windows Credential
  # Manager / macOS Keychain / Freedesktop Secret Service). Falls back
  # to plaintext config when no backend is present.
  "keyring>=25.0.0,<27",
  # P29 process-memory observability (MCP ``get_memory_breakdown``):
  # RSS + child-process enumeration. Imported defensively so a slim
  # install without it only loses the process section of that one tool.
  "psutil>=5.9.0,<8",
]

[project.optional-dependencies]
# Server-side voice: speech-to-text (RealtimeSTT -> faster-whisper +
# Silero VAD) and text-to-speech (Pocket-TTS). These pull in the heavy
# PyTorch / whisper stack, so they live behind an extra: the core app
# imports them defensively (try/except in app/stt + app/tts) and boots
# fine text-only when they're absent. ``pip install .`` = slim/text;
# ``pip install .[voice]`` = full voice. The slim Docker image omits
# this extra; the full image installs it.
voice = [
  # Both extras are mandatory, for different failure modes:
  #   * ``faster-whisper`` — 1.x moved the ASR engines behind extras, so a bare
  #     ``realtimestt`` imports fine and then raises
  #     ``No module named 'faster_whisper'`` when the transcription worker starts.
  #   * ``silero-onnx-cpu`` — without it the recorder loads Silero VAD through
  #     ``torch.hub``, which prompts "does not belong to the list of trusted
  #     repositories ... (y/N)". That defaults to *no* on any non-interactive
  #     run (containers, services), so VAD silently fails. This extra ships a
  #     self-contained local ONNX backend with no Torch Hub download at all.
  "realtimestt[faster-whisper,silero-onnx-cpu]>=1.0.2,<2",
  # Imported directly by app/audio/client_mic_source.py. It also arrives
  # transitively via realtimestt, but that import is guarded by try/except, so
  # an implicit dependency would degrade mic VAD silently instead of failing.
  "webrtcvad-wheels>=2.0.14,<3",
  "pocket-tts>=1.1.1,<2",
]
# Not installable on Linux + Python 3.13: openwakeword pulls tflite-runtime,
# which only publishes cp38-cp311 Linux wheels. Fine on Windows/macOS (the
# tflite dependency is Linux-gated), and fine on Linux with Python <=3.11.
# Deliberately left out of requirements.lock and the Docker image for that
# reason -- wake-word activation is opt-in and the app boots without it.
wake-word = [
  "openwakeword>=0.6.0,<0.7",
]
dev = [
  "pytest>=8.0.0,<10",
  # Lint. Ruff is pre-1.0 and adds rules in minors, which for a linter means a
  # patch bump can fail a previously green tree; the ceiling keeps that from
  # happening on someone else's machine. Configured in ``[tool.ruff]`` below.
  "ruff>=0.14.0,<1",
]
all = [
  "english-speaking-assistant[voice,wake-word,dev]",
]

[project.scripts]
aiko-web = "app.web.__main__:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.setuptools.package-dir]
app = "app"

[tool.ruff]
line-length = 100
target-version = "py311"
# ``data/`` is the runtime state directory (SQLite, LanceDB, persona files) and
# ``web/`` is the frontend; neither is ours to lint, and both can hold
# user-dropped files.
extend-exclude = ["data", "web"]

[tool.ruff.lint]
# Deliberately narrow: rules that catch real bugs or enforce something the
# project already asserts in prose, and nothing that is merely a matter of
# taste.
#
#   F  pyflakes -- unused imports/variables, and F541 (f-string with no
#      placeholders), which AGENTS.md and .cursorrules have both required all
#      along with nothing to enforce it.
#   E  pycodestyle errors -- line length, which .editorconfig already declares
#      as max_line_length = 100.
#   W  pycodestyle warnings -- trailing whitespace and missing final newline,
#      also already declared in .editorconfig.
#   B  flake8-bugbear -- the genuine-bug subset: mutable default arguments,
#      ``except`` ordering, loop variables captured by closures.
select = ["F", "E", "W", "B"]

# Not enabled, on purpose:
#   I (isort), UP (pyupgrade), SIM (flake8-simplify) -- each is a large
#     mechanical diff across ~780 files. They are worth doing, but as their own
#     commits against an already-green baseline, not folded into the pass that
#     establishes the baseline.
#   ruff format -- this codebase is full of hand-wrapped comments and prose
#     docstrings, and the formatter rewraps them. It would destroy exactly the
#     commentary that makes the code readable, in a diff too large to review.

[tool.ruff.lint.per-file-ignores]
# Package headers re-export their public surface for callers to import from,
# which is what an ``__init__`` is for; ruff reads that as unused.
"__init__.py" = ["F401"]
